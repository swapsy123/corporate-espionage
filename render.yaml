# Create a NEW blueprint/service from paid-beta. Never apply this to the free app.
services:
  - type: web
    name: levr-intelligence-beta
    runtime: docker
    branch: paid-beta
    plan: standard
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /healthz
    disk:
      name: levr-beta-private-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/levr-beta.sqlite
      - key: TRUST_PROXY
        value: "1"
      - key: OWNER_EMAIL
        value: fraser@wearelevr.com
      - key: LEVR_OWNER_PASSWORD
        sync: false
      - key: LEVR_SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: LEVR_AI_API_KEY
        sync: false
      - key: META_API_VERSION
        value: v23.0
